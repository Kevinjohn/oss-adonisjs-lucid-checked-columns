name: starter examples

on:
  pull_request:
    paths:
      - 'examples/starter/**'
      - '.github/workflows/examples.yml'
  push:
    branches: [main]
    paths:
      - 'examples/starter/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kit: [api, hypermedia, inertia_react, inertia_vue]
    defaults:
      run:
        working-directory: examples/starter/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/starter/${{ matrix.kit }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: node ace generate:key
      - run: node ace migration:run
      - run: node ace codegen
      - run: pnpm exec prettier --write database/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
